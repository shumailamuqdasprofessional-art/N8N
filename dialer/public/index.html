<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twilio Dialer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <!-- Login -->
    <section id="login">
      <h1>Dialer</h1>
      <form id="login-form">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="btn primary">Start</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <!-- Dialer -->
    <section id="dialer" hidden>
      <header>
        <span id="status-dot" class="dot"></span>
        <span id="status">Connecting…</span>
        <span id="timer"></span>
      </header>

      <input id="number" type="tel" placeholder="+1 555 123 4567" autocomplete="off">

      <div class="keypad" id="keypad">
        <button data-key="1">1<small>&nbsp;</small></button>
        <button data-key="2">2<small>ABC</small></button>
        <button data-key="3">3<small>DEF</small></button>
        <button data-key="4">4<small>GHI</small></button>
        <button data-key="5">5<small>JKL</small></button>
        <button data-key="6">6<small>MNO</small></button>
        <button data-key="7">7<small>PQRS</small></button>
        <button data-key="8">8<small>TUV</small></button>
        <button data-key="9">9<small>WXYZ</small></button>
        <button data-key="*">*<small>&nbsp;</small></button>
        <button data-key="0">0<small>+</small></button>
        <button data-key="#">#<small>&nbsp;</small></button>
      </div>

      <div class="actions">
        <button id="mute" class="btn round" disabled title="Mute">Mute</button>
        <button id="call" class="btn round call" disabled title="Call">Call</button>
        <button id="back" class="btn round" title="Delete">⌫</button>
      </div>

      <div id="incoming" class="incoming" hidden>
        <p>Incoming call from <strong id="incoming-from"></strong></p>
        <div>
          <button id="accept" class="btn call">Answer</button>
          <button id="reject" class="btn hangup">Decline</button>
        </div>
      </div>

      <ul id="log" class="log"></ul>
    </section>
  </main>

  <script src="twilio.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
